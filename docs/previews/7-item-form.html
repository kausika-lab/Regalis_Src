<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="http://localhost:8080/assets/index-BgQ7mK4p.css">
<style>body{padding:0}</style></head><body>
<div class="modal-overlay"><div class="modal" role="dialog">
 <header class="modal__header"><h2 class="modal__title">New item</h2>
  <button class="btn btn--ghost btn--sm">&times;</button></header>
 <div class="modal__body"><div class="form-stack">
  <div class="form-grid">
   <div class="field"><label class="field__label">Item <span class="field__required">*</span></label><input class="field__input" placeholder="e.g. Coffee Beans"></div>
   <div class="field"><label class="field__label">Item code <span class="field__required">*</span></label><input class="field__input" placeholder="e.g. C-12"><span class="field__hint">Unique across all items.</span></div>
   <div class="field"><label class="field__label">Location <span class="field__required">*</span></label><select class="field__input"><option>RR Nagar</option></select></div>
   <div class="field"><label class="field__label">Unit <span class="field__required">*</span></label><input class="field__input" value="Nos"></div>
   <div class="field"><label class="field__label">Current stock</label><input class="field__input" value="16"><span class="field__hint">Opening balance. Every later change comes from the ledger.</span></div>
   <div class="field"><label class="field__label">Unit cost (&#8377;)</label><input class="field__input" value="100"></div>
  </div>
  <div class="inv-kv" style="border-top:1px solid var(--border-subtle);padding-top:var(--space-4)">
   <div><div class="inv-kv__k">Status</div><div style="margin-top:2px"><span class="badge badge--success">OK</span></div></div>
   <div><div class="inv-kv__k">Total cost</div><div class="inv-kv__v">&#8377;1,600.00</div></div>
  </div>
  <p style="color:var(--text-muted);font-size:var(--font-size-xs);margin:0">Status and Total cost are calculated from stock and unit cost &mdash; they are never stored on the item.</p>
 </div></div>
 <footer class="modal__footer"><button class="btn btn--ghost">Cancel</button><button class="btn btn--primary">Save</button></footer>
</div></div></body></html>
