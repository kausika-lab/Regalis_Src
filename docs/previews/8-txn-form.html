<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="http://localhost:8080/assets/index-BgQ7mK4p.css">
<style>body{padding:0}</style></head><body>
<div class="modal-overlay"><div class="modal" role="dialog">
 <header class="modal__header"><h2 class="modal__title">New inventory transaction</h2>
  <button class="btn btn--ghost btn--sm">&times;</button></header>
 <div class="modal__body"><div class="form-stack">
  <div class="form-grid">
   <div class="field"><label class="field__label">Date <span class="field__required">*</span></label><input class="field__input" type="date" value="2026-09-21"></div>
   <div class="field"><label class="field__label">Item <span class="field__required">*</span></label><select class="field__input"><option>coffee (C-12)</option></select></div>
   <div class="field"><label class="field__label">Type</label><select class="field__input"><option>In (purchase / receipt)</option></select></div>
   <div class="field"><label class="field__label">Quantity <span class="field__required">*</span></label><input class="field__input" value="20"><span class="field__hint">1 in stock now</span></div>
   <div class="field"><label class="field__label">Reference</label><input class="field__input" placeholder="e.g. PO-0091"></div>
   <div class="field"><label class="field__label">Supplier</label><input class="field__input"></div>
   <div class="field"><label class="field__label">Unit cost (&#8377;)</label><input class="field__input" placeholder="0.00"></div>
  </div>
  <div class="field"><label class="field__label">Notes</label><input class="field__input" placeholder="Optional remarks"></div>
  <div class="inv-kv" style="border-top:1px solid var(--border-subtle);padding-top:var(--space-4)">
   <div><div class="inv-kv__k">Balance after</div><div class="inv-kv__v">21</div></div>
   <div><div class="inv-kv__k">Recorded by</div><div class="inv-kv__v">Regalis Admin</div></div>
  </div>
  <p style="color:var(--text-muted);font-size:var(--font-size-xs);margin:0">Balance after is calculated from the ledger, and Recorded by is set from your signed-in account &mdash; neither is stored from this form.</p>
 </div></div>
 <footer class="modal__footer"><button class="btn btn--ghost">Cancel</button><button class="btn btn--primary">Record</button></footer>
</div></div></body></html>
